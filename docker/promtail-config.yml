server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: file-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: auth
          service: auth-service
          __path__: /var/log/services/auth/*log
      - targets:
          - localhost
        labels:
          job: notification
          service: notification-service
          __path__: /var/log/services/notification/*log
      - targets:
          - localhost
        labels:
          job: gateway
          service: gateway-service
          __path__: /var/log/services/gateway/*log
